# Construit l'application Android signée (AAB pour le Play Store + APK pour installer à la main).
# Sans clé de signature configurée : produit seulement un APK de test (debug).
# Déclenchement : bouton « Run workflow » dans l'onglet Actions, ou envoi d'une étiquette v1.0.0, v1.0.1…
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version affiché (ex. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Le SDK Android est préinstallé sur les machines GitHub (ANDROID_HOME) : on accepte seulement les licences.
      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Application web (bundle) et synchronisation Capacitor
        run: |
          npm ci
          VERSION_NAME="${VERSION_NAME#v}"
          sed -i "s/version: '[^']*'/version: '${VERSION_NAME}'/" src/config.js
          npm run build
          npx cap sync android

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Pas de clé de signature (secret ANDROID_KEYSTORE_BASE64) : seul un APK de test (debug) sera produit."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Compilation
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          chmod +x gradlew
          mkdir -p ../dist
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/bundle/release/app-release.aab "../dist/gic-ndjeke-${VERSION_NAME}-${VERSION_CODE}.aab"
            cp app/build/outputs/apk/release/app-release.apk "../dist/gic-ndjeke-${VERSION_NAME}-${VERSION_CODE}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/gic-ndjeke-${VERSION_NAME}-${VERSION_CODE}-TEST.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gic-ndjeke-android-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
